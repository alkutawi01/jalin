name: Editorial Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  audit:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run editorial audit
        run: npm run audit:editorial -- --json
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      
      - name: Check audit results
        run: |
          result=$(npm run audit:editorial -- --json 2>/dev/null | grep -o '"authors":"[^"]*"' | cut -d'"' -f4)
          if [ "$result" = "fail" ]; then
            echo "❌ Authors check failed"
            exit 1
          fi
          
          result=$(npm run audit:editorial -- --json 2>/dev/null | grep -o '"revisions":"[^"]*"' | cut -d'"' -f4)
          if [ "$result" = "fail" ]; then
            echo "❌ Revisions check failed"
            exit 1
          fi
          
          echo "✅ Critical checks passed"
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}